name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python-and-sbom:
    name: Python and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile python/*.py packaging/*.py scripts/*.py
      - name: Produce and verify the release artifacts
        run: |
          python3 tests/m6-004_release_artifacts.py \
            --report "$RUNNER_TEMP/release-artifacts.json"
      - name: Check support matrix evidence and staleness
        run: |
          python tests/support_matrix_test.py
          python tests/m5-005_platform_matrix.py
      - name: Score PE32+ recovery against DWARF truth
        run: |
          cargo build --release -p romwright-cli
          python3 tests/m8-001_pe_unwind.py \
            --report "$RUNNER_TEMP/pe-unwind.json"
      - name: Publish multi-image projects as one milestone
        run: |
          python3 tests/m10-004_multi_image_milestone.py \
            --report "$RUNNER_TEMP/multi-image-milestone.json"
      - name: Keep analyst edits across a second import
        run: |
          python3 tests/m10-003_edit_durability.py \
            --report "$RUNNER_TEMP/edit-durability.json"
      - name: Move between the images a project holds
        run: |
          python3 tests/m10-002_image_navigation.py \
            --report "$RUNNER_TEMP/image-navigation.json"
      - name: Answer cross-program questions in one project
        run: |
          python3 tests/m10-001_multi_image.py \
            --report "$RUNNER_TEMP/multi-image.json"
      - name: Publish fact explanation as one milestone
        run: |
          python3 tests/m9-005_explanation_milestone.py \
            --report "$RUNNER_TEMP/explanation.json"
      - name: Drive the evidence filter from the terminal
        run: |
          python3 tests/m9-004_filter_surfaces.py \
            --report "$RUNNER_TEMP/filter-surfaces.json"
      - name: Filter paged reads by evidence kind
        run: |
          python3 tests/m9-003_evidence_filter.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/evidence-filter.json"
      - name: Score what each provenance class proves
        run: |
          python3 tests/m9-002_fact_confidence.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/evidence.json"
      - name: Check every provenance class is explained
        run: |
          python3 tests/m9-001_provenance_explained.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/provenance.json"
      - name: Publish PE parity as one milestone
        run: |
          python3 tests/m8-006_pe_parity.py \
            --report "$RUNNER_TEMP/pe-parity.json"
      - name: Name PE imports from the import directory
        run: |
          python3 tests/m8-005_pe_imports.py \
            --report "$RUNNER_TEMP/pe-imports.json"
      - name: Recover the roots a PE declares
        run: |
          python3 tests/m8-004_pe_roots.py \
            --report "$RUNNER_TEMP/pe-roots.json"
      - name: Score PE32 x86 recovery against stock Ghidra
        run: |
          python3 tests/m8-002_pe32_roots.py \
            --report "$RUNNER_TEMP/pe32-roots.json"
      - name: Check that reused gate stores are keyed by their provenance
        run: python3 tests/gate_cache_test.py
      - name: Check the evidence index
        run: python tests/m5-012_evidence_index.py
      - name: Run the documented workflow
        run: |
          cargo build --release -p romwright-cli
          python3 tests/m6-001_documented_workflow.py \
            --report "$RUNNER_TEMP/documented-workflow.json"
          cargo build --release -p romwright-api
          python3 tests/m6-002_documented_api.py \
            --report "$RUNNER_TEMP/documented-api.json"
          python3 tests/m6-005_scripting.py \
            --report "$RUNNER_TEMP/scripting.json"
          python3 tests/m6-006_documentation_coverage.py \
            --report "$RUNNER_TEMP/documentation-coverage.json"
  corpus-linux:
    name: Multi-Arch Corpus (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y llvm lld clang qemu-user
      - name: Run Multi-Architecture Corpus Gate
        run: |
          bash tests/m1-006_corpus.sh
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Reject corrupt corpus manifests
        run: python3 tests/m1-006_integrity_test.py
      - name: Reject corrupt PE symbol databases
        run: python3 tests/m1-006_pdb_test.py
      - name: Build packaged-library signature databases
        run: |
          python3 benchmarks/signature_gate.py \
            --report "$RUNNER_TEMP/signatures/m2-011.json"
      - name: Match packaged-library signatures
        run: |
          python3 benchmarks/match_gate.py \
            --report "$RUNNER_TEMP/signatures/m2-012.json"
      - name: Recover Itanium C++ classes
        run: |
          python3 scripts/gen_corpus.py \
            --architectures x86_64,i386,aarch64,powerpc \
            --out-dir "$RUNNER_TEMP/rtti/corpus"
          python3 benchmarks/rtti_gate.py \
            --corpus-dir "$RUNNER_TEMP/rtti/corpus" \
            --report "$RUNNER_TEMP/signatures/m2-013.json"
      - name: Recover MSVC RTTI classes
        run: |
          python3 benchmarks/msvc_rtti_gate.py \
            --corpus-dir "$RUNNER_TEMP/rtti/corpus" \
            --report "$RUNNER_TEMP/signatures/m2-014.json"
      - name: Retain signature evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-signature-reports
          path: |
            ${{ runner.temp }}/signatures/m2-011.json
            ${{ runner.temp }}/signatures/m2-012.json
            ${{ runner.temp }}/signatures/m2-013.json
            ${{ runner.temp }}/signatures/m2-014.json

  corpus-oracle:
    name: M1 Discovery and M2 References/Strings (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install corpus and console build tools
        run: sudo apt-get update && sudo apt-get install -y llvm lld clang build-essential binutils-dev zlib1g-dev libzstd-dev cmake qt6-base-dev
      - name: Install pinned Ghidra release
        run: |
          curl --fail --location --retry 3 https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip --output "$RUNNER_TEMP/ghidra.zip"
          echo "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  $RUNNER_TEMP/ghidra.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          echo "ROMWRIGHT_GHIDRA=$RUNNER_TEMP/ghidra_12.1.3_PUBLIC" >> "$GITHUB_ENV"
      - name: Generate and validate all 20 ELF oracles
        run: |
          python3 tests/m1-007_oracle_test.py
          python3 tests/m1-008_languages.py
          python3 tests/m1-008b_scoring_test.py
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Build native discovery console
        run: bash native/build_console.sh --jobs 2
      - name: Verify native function constant propagation
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: cargo test -p romwright-core native_runtime::tests::constant_propagation -- --nocapture
      - name: Generate matching discovery gate inputs
        run: |
          python3 scripts/gen_corpus.py \
            --architectures x86_64,i386,aarch64,powerpc \
            --out-dir "$RUNNER_TEMP/discovery/corpus"
          python3 scripts/gen_oracle.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --output-dir "$RUNNER_TEMP/discovery/oracle" \
            --report "$RUNNER_TEMP/discovery/oracle-report.json"
          python3 scripts/gen_function_scoring.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --oracle-dir "$RUNNER_TEMP/discovery/oracle" \
            --output-dir "$RUNNER_TEMP/discovery/scoring" \
            --report "$RUNNER_TEMP/discovery/scoring-report.json"
      - name: Provision the native spec bundles the corpus languages need
        run: |
          # The i386/AArch64/PowerPC spec bundles are gitignored build inputs
          # (native/specs/<lang>/), generated once through the JVM bridge from
          # the corpus's own plain_o0 rows. Without them every non-x86-64
          # decompile fails closed, which is what the mirror caught.
          python3 scripts/gen_native_specs.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --ghidra "$ROMWRIGHT_GHIDRA"
      - name: Enforce complete M1 discovery gate
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 benchmarks/discovery_gate.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --oracle-dir "$RUNNER_TEMP/discovery/oracle" \
            --scoring-dir "$RUNNER_TEMP/discovery/scoring" \
            --report "$RUNNER_TEMP/discovery/discovery-report.json"
      - name: Enforce the measured import budget
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m2-016_import_budget.py \
            --report "$RUNNER_TEMP/discovery/import-budget.json"
      - name: Check the committed library declarations against the archive
        run: python3 scripts/gen_library_prototypes.py --check
      - name: Apply declared prototypes to the imports an image names
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-009_library_prototypes.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/library-prototypes.json"
      - name: Type the words DT_PLTGOT reserves
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-007_got_pointers.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/got-pointers.json"
      - name: Render the image's own widths, exits and names
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-011_widths_exits_names.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/widths-exits-names.json"
      - name: Record the facts the exact token accounting names
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-012_remaining_facts.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/remaining-facts.json"
      - name: Type an initializer slot from the array that holds it
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-021_initializer_slots.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/initializer-slots.json"
      - name: Label a code address as code
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-020_label_prefixes.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/label-prefixes.json"
      - name: Count a prototype gap only where stock has the signature
        run: |
          python3 tests/m4-019_prototype_direction.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/prototype-direction.json"
      - name: Export what stock says it recovered
        run: |
          python3 tests/m4-018_oracle_prototypes.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/oracle-prototypes.json"
      - name: Name the loader's own entry points as stock names them
        run: |
          python3 tests/m4-017_entry_names.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/entry-names.json"
      - name: Count each divergence in the direction it points
        run: |
          python3 tests/m4-016_class_direction.py \
            --report "$RUNNER_TEMP/discovery/class-direction.json"
      - name: Record how wide each data access is
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-015_reference_widths.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/reference-widths.json"
      - name: Drive the worker the build was built with
        run: |
          python3 tests/m4-014_worker_resolution.py \
            --report "$RUNNER_TEMP/discovery/worker-resolution.json"
      - name: Override the branch that leaves a function for another entry
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-013_shared_returns.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/shared-returns.json"
      - name: Put each stub's override on the branch that transfers
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-010_stub_transfers.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/stub-transfers.json"
      - name: Correct the PLT header's flow from the image's ABI
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-006_plt_header.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/plt-header.json"
      - name: Pass the store's transfer facts to the decompiler
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-005_thunk_flow.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/thunk-flow.json"
      - name: Pass the store's data facts to the decompiler
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-004_data_names.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/data-names.json"
      - name: Select every language from the install's own opinion data
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-023_language_selection.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/language-selection.json"
      - name: Apply declarations in the language's own type names
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-025_declaration_types.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/declaration-types.json"
      - name: Record the try ranges the exception tables declare
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-024_exception_annotations.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/exception-annotations.json"
      - name: Type the words that hold addresses as pointers
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-027_pointer_slots.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/pointer-slots.json"
      - name: Hold the name a mangled name was mangled from
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-028_demangled_names.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/demangled-names.json"
      - name: Name the addresses the dynamic table declares
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-029_dynamic_tags.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/dynamic-tags.json"
      - name: Type a slot from what the image declares its target is
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-030_pointer_targets.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/pointer-targets.json"
      - name: Bound the one name we coin to its section
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-031_section_names.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/section-names.json"
      - name: Score every function producer on its own
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m17-002_producer_classes.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/reports/m17-002.json"
      - name: Find functions by the shape of the graph
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m17-001_cfg_functions.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/reports/m17-001.json"
      - name: Build the native desktop analysis gate
        run: |
          bash native/build_ghidra_opt.sh --jobs 2
          cmake -S desktop/romwright-qt -B build/romwright-qt -DCMAKE_BUILD_TYPE=Release
          cmake --build build/romwright-qt --config Release --target romwright-qt --parallel 2
      - name: Answer every query now, and say what is missing
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m14-003_facts_so_far.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/reports/m14-003.json"
      - name: Show facts so far in the window, then fill them in
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m14-004_ui_progress.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/reports/m14-004.json"
      - name: Infer parameter and return types from p-code
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m16-001_types.py \
            --report "$RUNNER_TEMP/reports/m16-001.json"
      - name: Structure our control-flow graphs with stock's structuring
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m15-001_structuring.py \
            --report "$RUNNER_TEMP/reports/m15-001.json"
      - name: Analyse one function on demand
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m14-002_demand.py \
            --report "$RUNNER_TEMP/reports/m14-002.json"
      - name: Load without analysing, and reuse an unchanged import
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m14-001_interactive_import.py \
            --report "$RUNNER_TEMP/discovery/interactive-import.json"
      - name: Recover jump tables without the decompiler
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m13-001_vsa_switch.py --report "$RUNNER_TEMP/discovery/vsa-switch.json"
      - name: Import a Switch module with no JVM
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          # Retail dump; the gate skips with a reason on a runner.
          python3 tests/m5-017_switch_module.py --report "$RUNNER_TEMP/discovery/switch-module.json"
      - name: Port names across builds and score the diff
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          # The game modules are not on a runner, so the modules rows are
          # skipped there; the corpus rows and the cross-optimisation rows
          # are the part every machine can reproduce.
          python3 tests/m12-001_diff.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --work "$RUNNER_TEMP/discovery/diff" \
            --report "$RUNNER_TEMP/discovery/diff.json"
      - name: Measure token identity against the oracle per language
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          # The parity rows include the mipsel corpus rows the oracle matrix
          # does not score; they are built into a corpus of their own so every
          # other gate keeps the 20-row matrix.
          python3 scripts/gen_corpus.py \
            --architectures x86_64,i386,aarch64,powerpc,mipsel \
            --out-dir "$RUNNER_TEMP/discovery/parity-corpus"
          python3 tests/m4-003_language_parity.py \
            --corpus-dir "$RUNNER_TEMP/discovery/parity-corpus" \
            --report "$RUNNER_TEMP/discovery/language-parity.json"
      - name: Publish measured improvement over stock as one milestone
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m4-002_improvement_milestone.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/improvement-milestone.json"
      - name: Enforce set-level thunk parity
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m5-008_thunk_parity.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --ghidra "$ROMWRIGHT_GHIDRA" \
            --report "$RUNNER_TEMP/discovery/thunk-parity.json"
      - name: Enforce linkage stub naming
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m5-009_linkage_names.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --ghidra "$ROMWRIGHT_GHIDRA" \
            --report "$RUNNER_TEMP/discovery/linkage-names.json"
      - name: Enforce initializer-array naming
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m5-010_initializer_names.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --ghidra "$ROMWRIGHT_GHIDRA" \
            --report "$RUNNER_TEMP/discovery/initializer-names.json"
      - name: Enforce pattern-label naming
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m5-011_pattern_labels.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --ghidra "$ROMWRIGHT_GHIDRA" \
            --report "$RUNNER_TEMP/discovery/pattern-labels.json"
      - name: Enforce the tail-call promotion gate
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m5-007_tailcall_promotion.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --oracle-dir "$RUNNER_TEMP/discovery/oracle" \
            --report "$RUNNER_TEMP/discovery/promotion.json"
      - name: Measure the cost envelope against stock Ghidra
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m7-001_cost_envelope.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --ghidra "$ROMWRIGHT_GHIDRA" \
            --report "$RUNNER_TEMP/discovery/cost-envelope.json"
      - name: Measure the decompile cost envelope against stock Ghidra
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m7-002_decompile_envelope.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --ghidra "$ROMWRIGHT_GHIDRA" \
            --report "$RUNNER_TEMP/discovery/decompile-envelope.json"
      - name: Bound the long-lived session envelope
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m7-003_session_envelope.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/session-envelope.json"
      - name: Gate recovered body extents against DWARF ranges
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m8-003_body_extents.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/body-extents.json"
      - name: Enforce the M3 DWARF ground-truth gate
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m3-001_dwarf_truth.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/dwarf-truth.json"
      - name: Enforce the Game Boy Advance platform gate
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m5-001_gba.py \
            --report "$RUNNER_TEMP/discovery/gba-platform.json"
      - name: Enforce the Nintendo DS platform gate
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m5-002_nds.py \
            --report "$RUNNER_TEMP/discovery/nds-platform.json"
      - name: Enforce the PlayStation and Nintendo 64 platform gates
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m5-003_psx.py \
            --report "$RUNNER_TEMP/discovery/psx-platform.json"
          python3 tests/m5-004_n64.py \
            --report "$RUNNER_TEMP/discovery/n64-platform.json"
      - name: Verify the frozen stock-Ghidra ground-truth baseline
        run: |
          python3 tests/m3-002_baseline.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/ground-truth-baseline.json"
      - name: Enforce the M3 ground-truth regression gate
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m3-003_regression.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --report "$RUNNER_TEMP/discovery/ground-truth-regression.json"
      - name: Verify reference analysis contracts
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 tests/m2-002_context.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --ghidra "$ROMWRIGHT_GHIDRA"
          cargo test -p romwright-core -- --nocapture
      - name: Enforce complete M2 data-reference gate
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 benchmarks/xref_gate.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --oracle-dir "$RUNNER_TEMP/discovery/xref-oracle" \
            --report "$RUNNER_TEMP/discovery/data-xref-report.json"
      - name: Enforce the tail-call reference gate
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          # Scores against the xref oracle the data-reference gate just
          # generated; the default oracle dir is a gitignored cache that a
          # fresh checkout does not have.
          python3 tests/m5-006_tailcall.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --oracle-dir "$RUNNER_TEMP/discovery/xref-oracle" \
            --report "$RUNNER_TEMP/discovery/tailcall.json"
      - name: Enforce complete M2 string gate
        env:
          ROMWRIGHT_CONSOLE: ${{ github.workspace }}/native/build/decomp_native
        run: |
          python3 benchmarks/string_gate.py \
            --corpus-dir "$RUNNER_TEMP/discovery/corpus" \
            --oracle-dir "$RUNNER_TEMP/discovery/string-oracle" \
            --report "$RUNNER_TEMP/discovery/strings-report.json"
      - name: Retain discovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-discovery-reports
          path: |
            ${{ runner.temp }}/discovery/*-report.json
            ${{ runner.temp }}/discovery/corpus/manifest.json
            ${{ runner.temp }}/reports/m14-004.json
      - name: Retain data-reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-data-reference-reports
          path: |
            ${{ runner.temp }}/discovery/data-xref-report.json
            ${{ runner.temp }}/discovery/xref-oracle/
      - name: Retain string evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-string-reports
          path: |
            ${{ runner.temp }}/discovery/strings-report.json
            ${{ runner.temp }}/discovery/strings-report-details/
            ${{ runner.temp }}/discovery/string-oracle/

  corpus-windows:
    name: MSVC Corpus (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build romwright-cli
        run: cargo build --release -p romwright-cli
      - name: Run MSVC Corpus Gate
        shell: bash
        run: |
          if [ -n "${VCToolsInstallDir:-}" ]; then
            export PATH="$(cygpath -u "$VCToolsInstallDir")/bin/Hostx64/x64:$PATH"
          fi
          bash tests/m1-006_corpus.sh --msvc-only
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  qt:
    name: Qt desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev
      - name: Install Qt on macOS
        if: runner.os == 'macOS'
        run: brew install qt
      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: win64_msvc2019_64
          cache: true
      - name: Configure desktop
        shell: bash
        run: |
          EXTRA_CMAKE_ARGS=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_CMAKE_ARGS=("-DCMAKE_C_COMPILER=cl" "-DCMAKE_CXX_COMPILER=cl")
          fi
          cmake -S desktop/romwright-qt -B build/romwright-qt -G Ninja -DCMAKE_BUILD_TYPE=Release "${EXTRA_CMAKE_ARGS[@]}"
      - name: Build desktop
        run: cmake --build build/romwright-qt --config Release --target romwright-qt
      - name: Build installer archive
        run: cmake --build build/romwright-qt --config Release --target package
      - name: Package, install and launch the desktop
        shell: bash
        run: |
          python3 tests/m6-003_desktop_package.py \
            --build-dir build/romwright-qt \
            --report "$RUNNER_TEMP/desktop-package-${{ runner.os }}.json"
      - name: Upload desktop package evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-package-${{ runner.os }}
          path: ${{ runner.temp }}/desktop-package-${{ runner.os }}.json
