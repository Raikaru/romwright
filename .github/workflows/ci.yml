name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python-and-sbom:
    name: Python and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile python/*.py packaging/*.py scripts/*.py
      - run: python packaging/sbom.py --output "$RUNNER_TEMP/ventris.spdx.json"
      - name: Validate SPDX document
        env:
          SBOM_PATH: ${{ runner.temp }}/ventris.spdx.json
        run: |
          python -c "import json, os; document = json.load(open(os.environ['SBOM_PATH'])); assert document['spdxVersion'] == 'SPDX-2.3'; assert document['packages']"
      - run: python packaging/update_manifest.py --version ci --root . --output "$RUNNER_TEMP/update.json" LICENSE
      - run: python packaging/verify_update.py "$RUNNER_TEMP/update.json" --root .
      - name: Validate AGENTS.md operating loop and CONTRIBUTING.md policy
        run: python tests/agents_policy_test.py
      - name: Check README support matrix is not stale
        run: python scripts/gen_support_matrix.py --check
  corpus-linux:
    name: Multi-Arch Corpus (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y llvm lld clang qemu-user
      - name: Run Multi-Architecture Corpus Gate
        run: |
          bash tests/m1-006_corpus.sh
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Reject corrupt corpus manifests
        run: python3 tests/m1-006_integrity_test.py
      - name: Reject corrupt PE symbol databases
        run: python3 tests/m1-006_pdb_test.py

  corpus-oracle:
    name: Ghidra Corpus Oracle (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y llvm lld clang
      - name: Install pinned Ghidra release
        run: |
          curl --fail --location --retry 3 https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip --output "$RUNNER_TEMP/ghidra.zip"
          echo "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  $RUNNER_TEMP/ghidra.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          echo "VENTRIS_GHIDRA=$RUNNER_TEMP/ghidra_12.1.3_PUBLIC" >> "$GITHUB_ENV"
      - name: Generate and validate all 20 ELF oracles
        run: |
          python3 tests/m1-007_oracle_test.py
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  corpus-windows:
    name: MSVC Corpus (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build lre-cli
        run: cargo build -p lre-cli
      - name: Run MSVC Corpus Gate
        shell: bash
        run: |
          if [ -n "${VCToolsInstallDir:-}" ]; then
            export PATH="$(cygpath -u "$VCToolsInstallDir")/bin/Hostx64/x64:$PATH"
          fi
          bash tests/m1-006_corpus.sh --msvc-only
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  qt:
    name: Qt desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev
      - name: Install Qt on macOS
        if: runner.os == 'macOS'
        run: brew install qt
      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: win64_msvc2019_64
          cache: true
      - name: Configure desktop
        shell: bash
        run: |
          EXTRA_CMAKE_ARGS=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_CMAKE_ARGS=("-DCMAKE_C_COMPILER=cl" "-DCMAKE_CXX_COMPILER=cl")
          fi
          cmake -S desktop/ventris-qt -B build/ventris-qt -G Ninja -DCMAKE_BUILD_TYPE=Release "${EXTRA_CMAKE_ARGS[@]}"
      - name: Build desktop
        run: cmake --build build/ventris-qt --config Release --target ventris-qt
      - name: Build installer archive
        run: cmake --build build/ventris-qt --config Release --target package
