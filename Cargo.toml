[workspace]
resolver = "3"
members = [
    "crates/lre-model",
    "crates/lre-db",
    "crates/lre-core",
    "crates/lre-cli",
    "crates/lre-worker",
    "crates/lre-worker-client",
    "crates/lre-qt-bridge",
    "crates/lre-api",
    "crates/lre-debug",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.5.0"
license = "Apache-2.0"
repository = "https://github.com/Raikaru/ventris"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
base64 = "0.22"
regex = "1"
