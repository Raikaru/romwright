[workspace]
resolver = "3"
members = [
    "crates/romwright-model",
    "crates/romwright-db",
    "crates/romwright-core",
    "crates/romwright-cli",
    "crates/romwright-worker",
    "crates/romwright-worker-client",
    "crates/romwright-qt-bridge",
    "crates/romwright-api",
    "crates/romwright-debug",
    "crates/romwright-sig",
    "crates/romwright-diff",
    "crates/romwright-facts",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.5.0"
license = "Apache-2.0"
repository = "https://github.com/Raikaru/romwright"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
base64 = "0.22"
regex = "1"

[profile.release]
# A wrapped address is a wrong answer, not a fast one: the AArch64 switch
# crash was only visible because a gate happened to run a checked build.
overflow-checks = true
