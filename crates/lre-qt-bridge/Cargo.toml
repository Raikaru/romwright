[package]
name = "lre-qt-bridge"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "CXX boundary for the Qt consumer over the lre-core facade"
build = "build.rs"


[lib]
crate-type = ["rlib", "staticlib"]
[dependencies]
cxx = "1"
lre-core = { path = "../lre-core" }
lre-model = { path = "../lre-model" }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cxx-build = "1"
