[package]
name = "romwright-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Romwright automation CLI over the Core API"

[[bin]]
name = "romwright-cli"
path = "src/main.rs"

[dependencies]
romwright-model = { path = "../romwright-model" }
romwright-db = { path = "../romwright-db" }
romwright-core = { path = "../romwright-core", default-features = false }
romwright-sig = { path = "../romwright-sig" }
romwright-diff = { path = "../romwright-diff" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

