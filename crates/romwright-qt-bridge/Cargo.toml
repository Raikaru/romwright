[package]
name = "romwright-qt-bridge"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "CXX boundary for the Qt consumer over the romwright-core facade"
build = "build.rs"


[lib]
crate-type = ["rlib", "staticlib"]
[dependencies]
cxx = "1"
romwright-core = { path = "../romwright-core" }
romwright-worker-client = { path = "../romwright-worker-client" }
romwright-model = { path = "../romwright-model" }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cxx-build = "1"
